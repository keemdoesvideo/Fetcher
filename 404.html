<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/fetcher-prefs.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost — Project Fetcher</title>
<link rel="icon" type="image/svg+xml" href="/fetcher-favicon.svg">
<link rel="stylesheet" href="/fetcher-theme.css">
<link rel="stylesheet" href="/fetcher-shell.css">
<style>
.main{
  width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:36px 22px;background:var(--bg);color:var(--ink);
}
.lost{width:min(520px,100%);text-align:center;}
.lost-mark{
  width:84px;height:84px;margin:0 auto 24px;display:block;
  border-radius:24px;box-shadow:0 12px 34px -18px rgba(0,0,0,.45);
  transform:rotate(-3deg);
}
.lost-code{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
.lost h1{font-size:clamp(34px,7vw,58px);line-height:1;letter-spacing:-.05em;margin:0;color:var(--ink-strong);}
.lost p{font-size:14px;line-height:1.7;color:var(--ink-soft);max-width:40ch;margin:18px auto 24px;}
.lost a{
  display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);
  border-radius:999px;padding:11px 17px;font-size:13px;font-weight:600;text-decoration:none;
  transition:transform var(--dur-fast) var(--ease-bounce),filter var(--dur-fast) var(--ease);
}
.lost a:hover{transform:translateY(-1px);filter:brightness(1.05);}
.lost a:active{transform:translateY(0) scale(.98);}
.lost a svg{width:15px;height:15px;}
html[data-motion="reduced"] .lost a:hover{transform:none;}
</style>
</head>
<body>
<main class="main">
  <section class="lost" aria-labelledby="lost-title">
    <img class="lost-mark" src="/fetcher-favicon.svg" alt="" aria-hidden="true">
    <span class="lost-code">404 · project fetcher</span>
    <h1 id="lost-title">lost the scent.</h1>
    <p>there's nothing to fetch here. the link may have wandered off, or this page never existed in the first place.</p>
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>back to fetcher</span>
    </a>
  </section>
</main>
</body>
</html>
