name: Refine frequent interaction motion

on:
  push:
    branches:
      - fix/paw-cursor-readability
    paths:
      - .github/workflows/refine-frequent-motion.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Normalize frequent interactions
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: marker not found: {old[:70]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = Path('fetcher-main.css')
          shell = Path('fetcher-shell.css')

          # Frequent presses should feel tactile, not squashy.
          replace_exact(main, '.fetch-btn:active{transform:scale(.94);}', '.fetch-btn:active{transform:scale(.97);}')
          replace_exact(main, '.paste-btn:active{transform:scale(.96);}', '.paste-btn:active{transform:scale(.97);}')
          replace_exact(main, '.dl-bubble-toggle:active{transform:scale(.95);}', '.dl-bubble-toggle:active{transform:scale(.97);}')
          replace_exact(main, '.kbd-bubble-toggle:active{transform:scale(.95);}', '.kbd-bubble-toggle:active{transform:scale(.97);}')
          replace_exact(main, '.recent-remove:active{transform:scale(.9);}', '.recent-remove:active{transform:scale(.97);}')
          replace_exact(shell, '.rail-toggle:active{transform:scale(.92);}', '.rail-toggle:active{transform:scale(.97);}')
          replace_exact(shell, '.rail-btn:active{transform:scale(.95);}', '.rail-btn:active{transform:scale(.97);}')

          # Constant indeterminate progress should be linear.
          replace_exact(main,
              'animation:fetch-indeterminate 1.15s ease-in-out infinite;',
              'animation:fetch-indeterminate 1.15s linear infinite;')

          # Base hover states keep colour/border feedback; spatial flourishes are
          # installed below only for Full motion on a real hover pointer.
          replace_exact(main,
              '.chip:hover{border-color:var(--border-strong);color:var(--ink);transform:translateY(-1px);}',
              '.chip:hover{border-color:var(--border-strong);color:var(--ink);}')
          replace_exact(main,
              '.seg-btn:hover svg{opacity:.9;transform:translateY(-1px);}',
              '.seg-btn:hover svg{opacity:.9;}')
          replace_exact(main,
              '.recent-refetch:hover{border-color:var(--border-strong);transform:translateY(-1px);}',
              '.recent-refetch:hover{border-color:var(--border-strong);}')
          replace_exact(main,
              '.recent-refetch:hover .recent-redo{opacity:.85;}.recent-refetch:hover .recent-redo svg{transform:rotate(-25deg);}.recent-redo svg{transition:transform var(--dur-fast) var(--ease-bounce);}',
              '.recent-refetch:hover .recent-redo{opacity:.85;}.recent-redo svg{transition:transform var(--dur-fast) var(--ease-bounce);}')
          replace_exact(main,
              '.welcome-btn:hover{transform:translateY(-2px);background:var(--ink-strong);}.welcome-btn:active{transform:translateY(0) scale(.97);}',
              '.welcome-btn:hover{background:var(--ink-strong);}.welcome-btn:active{transform:scale(.97);}')

          replace_exact(shell, '.rail-btn:hover svg{transform:translateY(-1px);}', '')
          replace_exact(shell, '.rail-icons .rail-btn.donate:hover svg{transform:translateY(-1px) scale(1.06);}', '')
          replace_exact(shell,
              '@media (hover:none),(pointer:coarse){.rail-btn:hover svg,.rail-icons .rail-btn.donate:hover svg{transform:none!important;}}',
              '@media (hover:hover) and (pointer:fine){\n'
              '  html[data-motion="full"] .rail-btn:hover svg{transform:translateY(-1px);}\n'
              '  html[data-motion="full"] .rail-icons .rail-btn.donate:hover svg{transform:translateY(-1px) scale(1.06);}\n'
              '}')

          text = main.read_text(encoding='utf-8')
          marker = '/* Reduced keeps useful opacity/state feedback but removes decorative spatial motion. */'
          gated = '''/* Decorative pointer movement is a Full-motion flourish only. */
          @media (hover:hover) and (pointer:fine){
            html[data-motion="full"] .chip:hover{transform:translateY(-1px);}
            html[data-motion="full"] .seg-btn:hover svg{transform:translateY(-1px);}
            html[data-motion="full"] .recent-refetch:hover{transform:translateY(-1px);}
            html[data-motion="full"] .recent-refetch:hover .recent-redo svg{transform:rotate(-25deg);}
            html[data-motion="full"] .welcome-btn:hover{transform:translateY(-2px);}
          }

          '''
          if gated.strip() not in text:
              if marker not in text:
                  raise SystemExit('fetcher-main.css: reduced-motion marker missing')
              text = text.replace(marker, gated + marker, 1)
              main.write_text(text, encoding='utf-8')

      - name: Validate interaction polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          main = Path('fetcher-main.css').read_text(encoding='utf-8')
          shell = Path('fetcher-shell.css').read_text(encoding='utf-8')

          for bad in ['scale(.94)', 'scale(.92)', 'scale(.9);']:
              assert bad not in main + shell, bad
          assert 'animation:fetch-indeterminate 1.15s linear infinite;' in main
          assert '@media (hover:hover) and (pointer:fine)' in main
          assert '@media (hover:hover) and (pointer:fine)' in shell
          assert 'html[data-motion="full"] .chip:hover' in main
          assert 'html[data-motion="full"] .rail-btn:hover svg' in shell
          assert '@media (hover:none)' not in shell

          for name in ['fetcher-main.css','fetcher-shell.css']:
              text = Path(name).read_text(encoding='utf-8')
              stripped = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              stripped = re.sub(r'"(?:\\.|[^"\\])*"', '""', stripped)
              stripped = re.sub(r"'(?:\\.|[^'\\])*'", "''", stripped)
              assert stripped.count('{') == stripped.count('}'), name
          PY

      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/refine-frequent-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-main.css fetcher-shell.css .github/workflows/refine-frequent-motion.yml
          git commit -m "Refine frequent interaction motion"
          git push origin HEAD:fix/paw-cursor-readability
