name: Add secret name palettes

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Implement secret palette system
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---- preferences: session-scoped palette state, applied before paint ----
          p = Path('fetcher-prefs.js')
          s = p.read_text()

          old = """  var DEFAULTS = {
            'fetcher.theme': 'auto',
            'fetcher.videoQuality': 'best',
            'fetcher.videoFormat': 'mp4',
            'fetcher.audioFormat': 'mp3',
            'fetcher.audioQuality': 'best',
            'fetcher.filenameStyle': 'clean',
            'fetcher.motion': 'system',
            'fetcher.showShortcuts': 'on',
            'fetcher.showDownloads': 'on'
          };
"""
          new = old + """
          var EASTER_KEY = 'fetcher.easterPalette';
          var EASTER_PALETTES = { ailincia: true, vitaviita: true, stonakah: true };
"""
          assert old in s, 'prefs defaults marker missing'
          s = s.replace(old, new, 1)

          marker = """  function systemPrefersDark() {
"""
          insert = """  function getEasterPalette() {
            try {
              var value = global.sessionStorage.getItem(EASTER_KEY) || '';
              return EASTER_PALETTES[value] ? value : '';
            } catch (e) {
              return '';
            }
          }

          function applyEasterPalette() {
            var value = getEasterPalette();
            if (value) document.documentElement.setAttribute('data-easter-palette', value);
            else document.documentElement.removeAttribute('data-easter-palette');
          }

          function setEasterPalette(value) {
            value = EASTER_PALETTES[value] ? value : '';
            try {
              if (value) global.sessionStorage.setItem(EASTER_KEY, value);
              else global.sessionStorage.removeItem(EASTER_KEY);
            } catch (e) {}
            applyEasterPalette();
            try {
              document.dispatchEvent(new CustomEvent('fetcher:easter-change', { detail: { palette: value } }));
            } catch (e) {}
          }

""" + marker
          assert marker in s, 'prefs system theme marker missing'
          s = s.replace(marker, insert, 1)

          old = """  applyTheme();
          applyMotion();
          applyChrome();
"""
          new = """  applyTheme();
          applyMotion();
          applyChrome();
          applyEasterPalette();
"""
          assert old in s, 'prefs initial apply marker missing'
          s = s.replace(old, new, 1)

          old = """    if (e.key === 'fetcher.theme') applyTheme();
            if (e.key === 'fetcher.motion') applyMotion();
            if (e.key === 'fetcher.showShortcuts' || e.key === 'fetcher.showDownloads') applyChrome();
"""
          new = """    if (e.key === 'fetcher.theme') applyTheme();
            if (e.key === 'fetcher.motion') applyMotion();
            if (e.key === 'fetcher.showShortcuts' || e.key === 'fetcher.showDownloads') applyChrome();
            if (e.key === EASTER_KEY) applyEasterPalette();
"""
          assert old in s, 'prefs storage listener marker missing'
          s = s.replace(old, new, 1)

          old = """    applyTheme: applyTheme,
            applyMotion: applyMotion,
            applyChrome: applyChrome
"""
          new = """    applyTheme: applyTheme,
            applyMotion: applyMotion,
            applyChrome: applyChrome,
            getEasterPalette: getEasterPalette,
            setEasterPalette: setEasterPalette,
            applyEasterPalette: applyEasterPalette
"""
          assert old in s, 'prefs export marker missing'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---- shell CSS: palette token overrides + wash/drain overlay ----
          p = Path('fetcher-shell.css')
          s = p.read_text()
          marker = """/* ---------- Theme-aware arrow cursor ----------"""
          css = r'''/* ---------- Secret name palettes ----------
   Session-scoped Easter eggs. These override only colour tokens, so the
   existing layout, motion and Light/Dark preference system remain untouched. */
html[data-theme="light"][data-easter-palette="ailincia"]{
  --bg:#FFF0F5;--surface:#FFF8FA;--rail:#FAEBD7;
  --ink:#2B2024;--ink-strong:#140D10;--ink-soft:#725A62;--ink-faint:#A27F8A;
  --border:#FFDAB9;--border-strong:#FFB6C1;
  --accent:#FFB6C1;--accent-ink:#87384F;--accent-tint:#FFE4E1;--on-accent:#2B2024;
  --audio:#E5A873;--audio-tint:#FFDAB9;
}
html[data-theme="dark"][data-easter-palette="ailincia"]{
  --bg:#1A1216;--surface:#261A20;--rail:#21151A;
  --ink:#FFF0F5;--ink-strong:#FFFFFF;--ink-soft:#E8C7D0;--ink-faint:#A77C88;
  --border:#4D3039;--border-strong:#70424F;
  --accent:#FFB6C1;--accent-ink:#FFDCE3;--accent-tint:rgba(255,182,193,.18);--on-accent:#2B2024;
  --audio:#FFDAB9;--audio-tint:rgba(255,218,185,.18);
}

html[data-theme="light"][data-easter-palette="vitaviita"]{
  --bg:#F4FAFF;--surface:#FBFDFF;--rail:#DBEDFF;
  --ink:#18213E;--ink-strong:#0B1024;--ink-soft:#566384;--ink-faint:#8390B1;
  --border:#C7DDFF;--border-strong:#ACCBFF;
  --accent:#8993FF;--accent-ink:#3949B7;--accent-tint:#DBEDFF;--on-accent:#101634;
  --audio:#93ACFF;--audio-tint:#DCE7FF;
}
html[data-theme="dark"][data-easter-palette="vitaviita"]{
  --bg:#0F1425;--surface:#161D35;--rail:#121A30;
  --ink:#F4FAFF;--ink-strong:#FFFFFF;--ink-soft:#C6D5F4;--ink-faint:#7C8DB5;
  --border:#293858;--border-strong:#3D527D;
  --accent:#8993FF;--accent-ink:#C7D4FF;--accent-tint:rgba(137,147,255,.20);--on-accent:#101634;
  --audio:#ACCBFF;--audio-tint:rgba(172,203,255,.18);
}

html[data-theme="light"][data-easter-palette="stonakah"]{
  --bg:#F4EFEA;--surface:#FBF8F5;--rail:#E8DED4;
  --ink:#171316;--ink-strong:#050506;--ink-soft:#625451;--ink-faint:#8B7771;
  --border:#D7C5B9;--border-strong:#B9A08F;
  --accent:#7A2138;--accent-ink:#5B162A;--accent-tint:#EAD6DC;--on-accent:#FFFFFF;
  --audio:#223654;--audio-tint:#DCE3EC;
  --mute:#7A503D;--mute-tint:#E8DAD2;
}
html[data-theme="dark"][data-easter-palette="stonakah"]{
  --bg:#0D0D10;--surface:#17151A;--rail:#11131A;
  --ink:#F4EEE9;--ink-strong:#FFFFFF;--ink-soft:#BDAFA9;--ink-faint:#776B67;
  --border:#30272A;--border-strong:#49373A;
  --accent:#8D2947;--accent-ink:#F0A6B9;--accent-tint:rgba(141,41,71,.22);--on-accent:#FFFFFF;
  --audio:#2E466E;--audio-tint:rgba(46,70,110,.28);
  --mute:#8A604A;--mute-tint:rgba(138,96,74,.22);
}

html{--easter-wash-dur:560ms;--easter-wash-settle:180ms;}
html[data-motion="reserved"]{--easter-wash-dur:360ms;--easter-wash-settle:150ms;}
html[data-motion="reduced"]{--easter-wash-dur:120ms;--easter-wash-settle:100ms;}

.fetcher-easter-wash{
  position:fixed;inset:0;z-index:10000;pointer-events:none;opacity:1;
  clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));
  transition:clip-path var(--easter-wash-dur) cubic-bezier(.16,.84,.44,1),opacity var(--easter-wash-settle) var(--ease);
  will-change:clip-path,opacity;
}
.fetcher-easter-wash.is-color{background:var(--easter-wash-bg,#fff);}
.fetcher-easter-wash.is-drain{
  background:rgba(128,128,128,.025);
  -webkit-backdrop-filter:grayscale(1) saturate(0);backdrop-filter:grayscale(1) saturate(0);
}
.fetcher-easter-wash.in{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}
.fetcher-easter-wash.out{opacity:0;}
html[data-motion="reserved"] .fetcher-easter-wash{transition-timing-function:var(--ease),var(--ease);}
html[data-motion="reduced"] .fetcher-easter-wash{
  clip-path:none!important;opacity:0;
  transition:opacity var(--easter-wash-dur) linear;
}
html[data-motion="reduced"] .fetcher-easter-wash.in{opacity:1;}
html[data-motion="reduced"] .fetcher-easter-wash.out{opacity:0;}

'''
          assert marker in s, 'shell cursor marker missing'
          s = s.replace(marker, css + marker, 1)
          p.write_text(s)

          # ---- navigation: full-viewport transition controller ----
          p = Path('fetcher-nav.js')
          s = p.read_text()
          marker = """  /* -----------------------------------------------------------------------
             Persistent rail state
          ----------------------------------------------------------------------- */
"""
          insert = r'''  /* -----------------------------------------------------------------------
     Secret palette wash / drain
  ----------------------------------------------------------------------- */
  var EASTER_WASHES = {
    ailincia: 'linear-gradient(135deg,#FFB6C1 0%,#FFDAB9 28%,#FFE4E1 52%,#FFF0F5 76%,#FAEBD7 100%)',
    vitaviita: 'linear-gradient(135deg,#F4FAFF 0%,#DBEDFF 24%,#ACCBFF 50%,#93ACFF 74%,#8993FF 100%)',
    stonakah: 'linear-gradient(135deg,#111114 0%,#6E1F34 34%,#6B4A3A 66%,#18243B 100%)'
  };

  function runEasterTransition(name, origin) {
    name = EASTER_WASHES[name] ? name : '';
    var reset = !name;
    var x = origin && Number.isFinite(origin.x) ? origin.x : window.innerWidth / 2;
    var y = origin && Number.isFinite(origin.y) ? origin.y : window.innerHeight / 2;
    var duration = cssDuration('--easter-wash-dur', 560);
    var settle = cssDuration('--easter-wash-settle', 180);

    return new Promise(function (resolve) {
      if (!document.body || !window.FetcherPrefs || !FetcherPrefs.setEasterPalette) {
        if (window.FetcherPrefs && FetcherPrefs.setEasterPalette) FetcherPrefs.setEasterPalette(name);
        resolve();
        return;
      }

      var overlay = document.createElement('div');
      overlay.className = 'fetcher-easter-wash ' + (reset ? 'is-drain' : 'is-color');
      overlay.setAttribute('aria-hidden', 'true');
      overlay.style.setProperty('--easter-x', Math.round(x) + 'px');
      overlay.style.setProperty('--easter-y', Math.round(y) + 'px');
      if (!reset) overlay.style.setProperty('--easter-wash-bg', EASTER_WASHES[name]);
      document.body.appendChild(overlay);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () { overlay.classList.add('in'); });
      });

      window.setTimeout(function () {
        FetcherPrefs.setEasterPalette(name);
        overlay.classList.add('out');
        window.setTimeout(function () {
          if (overlay.parentNode) overlay.remove();
          resolve();
        }, settle + 40);
      }, duration);
    });
  }

  window.FetcherEaster = { transitionTo: runEasterTransition };

''' + marker
          assert marker in s, 'nav persistent rail marker missing'
          s = s.replace(marker, insert, 1)
          p.write_text(s)

          # ---- main controller: exact-name interception before detect/fetch ----
          p = Path('fetcher-main.js')
          s = p.read_text()

          old = """  var busy = false;
          var lastModes = null;
          var detectTimer = null;
          var detectSeq = 0;
"""
          new = """  var busy = false;
          var easterAnimating = false;
          var lastModes = null;
          var detectTimer = null;
          var detectSeq = 0;

          var EASTER_NAMES = {
            ailincia: 'ailincia',
            vitaviita: 'vitaviita',
            stonakah: 'stonakah',
            fetcher: ''
          };

          function easterForValue(value) {
            var key = String(value || '').trim().toLowerCase();
            if (!Object.prototype.hasOwnProperty.call(EASTER_NAMES, key)) return null;
            return { palette: EASTER_NAMES[key], reset: key === 'fetcher' };
          }

          function easterOrigin() {
            var rect = input.getBoundingClientRect();
            var x = rect.left + rect.width / 2;
            var y = rect.top + rect.height / 2;
            try {
              if (window.frameElement) {
                var frameRect = window.frameElement.getBoundingClientRect();
                x += frameRect.left;
                y += frameRect.top;
              }
            } catch (e) {}
            return { x: x, y: y };
          }

          function runEasterEgg(egg) {
            if (!egg || busy || easterAnimating) return;
            easterAnimating = true;
            clearTimeout(detectTimer);
            lastModes = null;
            applyModes(null);
            applyLongForm(false);

            input.disabled = true;
            pasteBtn.disabled = true;
            fetchBtn.disabled = true;
            segBtns.forEach(function (btn) { btn.disabled = true; });
            input.value = egg.reset ? 'back to fetcher.' : 'found you.';
            updateFetchVisibility();

            var host = window;
            try {
              if (window.parent && window.parent !== window && window.parent.FetcherEaster) host = window.parent;
            } catch (e) {}
            var controller = host.FetcherEaster || window.FetcherEaster;
            var transition = controller && controller.transitionTo
              ? controller.transitionTo(egg.palette, easterOrigin())
              : Promise.resolve().then(function () { FetcherPrefs.setEasterPalette(egg.palette); });

            Promise.resolve(transition).catch(function () {
              FetcherPrefs.setEasterPalette(egg.palette);
            }).then(function () {
              input.value = '';
              input.disabled = false;
              pasteBtn.disabled = false;
              fetchBtn.disabled = false;
              easterAnimating = false;
              updateFetchVisibility();
              restoreModes();
              input.focus();
            });
          }
"""
          assert old in s, 'main busy vars marker missing'
          s = s.replace(old, new, 1)

          old = """  function detectProvider() {
            var url = input.value.trim();
            if (!url) {
              lastModes = null;
              applyModes(null);
              applyLongForm(false);
              return;
            }
"""
          new = """  function detectProvider() {
            var url = input.value.trim();
            if (!url) {
              lastModes = null;
              applyModes(null);
              applyLongForm(false);
              return;
            }
            if (easterForValue(url)) {
              lastModes = null;
              applyModes(null);
              applyLongForm(false);
              return;
            }
"""
          assert old in s, 'main detect marker missing'
          s = s.replace(old, new, 1)

          old = """  function runFetchFlow() {
            if (busy) return;
            var url = input.value.trim();
            if (!url) return;
            var mode = getMode();
"""
          new = """  function runFetchFlow() {
            if (busy || easterAnimating) return;
            var url = input.value.trim();
            if (!url) return;
            var easter = easterForValue(url);
            if (easter) {
              runEasterEgg(easter);
              return;
            }
            var mode = getMode();
"""
          assert old in s, 'main runFetchFlow marker missing'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate scripts and markers
        run: |
          node --check fetcher-prefs.js
          node --check fetcher-nav.js
          node --check fetcher-main.js
          python - <<'PY'
          from pathlib import Path
          prefs=Path('fetcher-prefs.js').read_text()
          nav=Path('fetcher-nav.js').read_text()
          main=Path('fetcher-main.js').read_text()
          css=Path('fetcher-shell.css').read_text()
          assert 'data-easter-palette' in prefs
          assert 'window.FetcherEaster' in nav
          assert "ailincia: 'ailincia'" in main
          assert 'fetcher-easter-wash' in css
          assert css.count('{') == css.count('}')
          PY

      - name: Commit implementation and retire workflow
        run: |
          rm .github/workflows/add-secret-palettes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-prefs.js fetcher-nav.js fetcher-main.js fetcher-shell.css .github/workflows/add-secret-palettes.yml
          git commit -m "Add secret name palette easter eggs"
          git push origin HEAD:fix/paw-cursor-readability
