name: Validate Fetcher deep cleanup

on:
  push:
    branches:
      - fix/paw-cursor-readability
    paths:
      - .github/workflows/validate-deep-cleanup.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Normalize static shell stylesheet links
        shell: python
        run: |
          from pathlib import Path

          pages = [
              'project-fetcher.html', 'image.html', 'chat.html', 'settings.html',
              'donate.html', 'updates.html', 'about.html'
          ]
          theme = '<link rel="stylesheet" href="fetcher-theme.css">'
          shell = '<link rel="stylesheet" href="fetcher-shell.css">'
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if shell not in text:
                  if theme not in text:
                      raise SystemExit(f'{name}: theme stylesheet marker missing')
                  text = text.replace(theme, theme + '\n' + shell, 1)
                  path.write_text(text, encoding='utf-8')

          shell_css = Path('fetcher-shell.css')
          text = shell_css.read_text(encoding='utf-8')
          text = text.replace(
              '/* The persistent shell replaced the old cross-document View Transition system. */\n@view-transition{navigation:none;}\n\n',
              ''
          )
          shell_css.write_text(text, encoding='utf-8')

      - name: Check JavaScript syntax
        run: |
          for file in fetcher-prefs.js fetcher-nav.js fetcher-main.js fetcher-settings.js fetcher-trimmer.js; do
            node --check "$file"
          done

      - name: Check Python syntax
        run: python -m compileall -q server run.py

      - name: Check ownership and asset wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'project-fetcher.html', 'image.html', 'chat.html', 'settings.html',
              'donate.html', 'updates.html', 'about.html'
          ]
          for name in pages:
              text = Path(name).read_text(encoding='utf-8')
              assert text.count('href="fetcher-shell.css"') == 1, f'{name}: shell CSS link missing/duplicated'

          main = Path('project-fetcher.html').read_text(encoding='utf-8')
          settings = Path('settings.html').read_text(encoding='utf-8')
          assert '<style>' not in main and '<style>' not in settings, 'interactive pages still contain inline style blocks'
          assert 'fetcher-main.css' in main and 'fetcher-main.js' in main
          assert 'fetcher-settings.css' in settings and 'fetcher-settings.js' in settings

          js = '\n'.join(Path(name).read_text(encoding='utf-8') for name in ['fetcher-nav.js','fetcher-main.js','fetcher-settings.js'])
          assert 'offsetWidth;' not in js, 'forced offsetWidth animation flush remains in cleaned controllers'
          assert 'shellLink' not in Path('fetcher-nav.js').read_text(encoding='utf-8'), 'nav still owns stylesheet loading'

          theme = Path('fetcher-theme.css').read_text(encoding='utf-8')
          assert 'Cursor: a cream dog paw' not in theme
          assert '@view-transition' not in theme
          assert 'view-transition-name:rail' not in theme
          assert 'view-transition-name:nav-pill' not in theme

          shell = Path('fetcher-shell.css').read_text(encoding='utf-8')
          assert '@view-transition' not in shell

          # Lightweight brace-balance sanity check after stripping comments/strings.
          for name in ['fetcher-theme.css','fetcher-shell.css','fetcher-main.css','fetcher-settings.css','fetcher-trimmer.css']:
              text = Path(name).read_text(encoding='utf-8')
              stripped = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              stripped = re.sub(r'"(?:\\.|[^"\\])*"', '""', stripped)
              stripped = re.sub(r"'(?:\\.|[^'\\])*'", "''", stripped)
              assert stripped.count('{') == stripped.count('}'), f'{name}: unbalanced braces'

      - name: Commit normalized shell links and remove validator
        run: |
          rm .github/workflows/validate-deep-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-fetcher.html image.html chat.html settings.html donate.html updates.html about.html fetcher-shell.css .github/workflows/validate-deep-cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize shell stylesheet ownership"
          git push origin HEAD:fix/paw-cursor-readability
