name: Refine Easter palettes

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

# One-shot refinement; removes itself after applying the contained Easter changes.
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
      - name: Refine palette depth and reveal motion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fetcher-nav.js')
          s = p.read_text()

          replacements = {
            'html[data-theme="light"][data-easter-palette="ailincia"]{--bg:#FFF0F5;--surface:#FFF8FA;--rail:#FAEBD7;--ink:#2B2024;--ink-strong:#140D10;--ink-soft:#725A62;--ink-faint:#A27F8A;--border:#FFDAB9;--border-strong:#FFB6C1;--accent:#FFB6C1;--accent-ink:#87384F;--accent-tint:#FFE4E1;--on-accent:#2B2024;--audio:#E5A873;--audio-tint:#FFDAB9;}':
            'html[data-theme="light"][data-easter-palette="ailincia"]{--bg:#FFB6C1;--surface:#FFF0F5;--rail:#FAEBD7;--ink:#2B2024;--ink-strong:#140D10;--ink-soft:#725A62;--ink-faint:#946F7A;--border:#FFDAB9;--border-strong:#EFA6B3;--accent:#D96F8C;--accent-ink:#733047;--accent-tint:#FFE4E1;--on-accent:#FFFFFF;--audio:#C98A55;--audio-tint:#FFDAB9;}',
            'html[data-theme="dark"][data-easter-palette="ailincia"]{--bg:#1A1216;--surface:#261A20;--rail:#21151A;--ink:#FFF0F5;--ink-strong:#FFFFFF;--ink-soft:#E8C7D0;--ink-faint:#A77C88;--border:#4D3039;--border-strong:#70424F;--accent:#FFB6C1;--accent-ink:#FFDCE3;--accent-tint:rgba(255,182,193,.18);--on-accent:#2B2024;--audio:#FFDAB9;--audio-tint:rgba(255,218,185,.18);}':
            'html[data-theme="dark"][data-easter-palette="ailincia"]{--bg:#4A2733;--surface:#2A1920;--rail:#351F28;--ink:#FFF0F5;--ink-strong:#FFFFFF;--ink-soft:#E8C7D0;--ink-faint:#B68B96;--border:#6A3B49;--border-strong:#8D4E60;--accent:#FFB6C1;--accent-ink:#FFDCE3;--accent-tint:rgba(255,182,193,.20);--on-accent:#2B2024;--audio:#FFDAB9;--audio-tint:rgba(255,218,185,.20);}',
            'html[data-theme="light"][data-easter-palette="vitaviita"]{--bg:#F4FAFF;--surface:#FBFDFF;--rail:#DBEDFF;--ink:#18213E;--ink-strong:#0B1024;--ink-soft:#566384;--ink-faint:#8390B1;--border:#C7DDFF;--border-strong:#ACCBFF;--accent:#8993FF;--accent-ink:#3949B7;--accent-tint:#DBEDFF;--on-accent:#101634;--audio:#93ACFF;--audio-tint:#DCE7FF;}':
            'html[data-theme="light"][data-easter-palette="vitaviita"]{--bg:#8993FF;--surface:#F4FAFF;--rail:#DBEDFF;--ink:#18213E;--ink-strong:#0B1024;--ink-soft:#4F5C7D;--ink-faint:#7482A5;--border:#C3D9FF;--border-strong:#ACCBFF;--accent:#5368DF;--accent-ink:#273694;--accent-tint:#DBEDFF;--on-accent:#FFFFFF;--audio:#6E89E8;--audio-tint:#DCE7FF;}',
            'html[data-theme="dark"][data-easter-palette="vitaviita"]{--bg:#0F1425;--surface:#161D35;--rail:#121A30;--ink:#F4FAFF;--ink-strong:#FFFFFF;--ink-soft:#C6D5F4;--ink-faint:#7C8DB5;--border:#293858;--border-strong:#3D527D;--accent:#8993FF;--accent-ink:#C7D4FF;--accent-tint:rgba(137,147,255,.20);--on-accent:#101634;--audio:#ACCBFF;--audio-tint:rgba(172,203,255,.18);}':
            'html[data-theme="dark"][data-easter-palette="vitaviita"]{--bg:#26346A;--surface:#151D3B;--rail:#1C274F;--ink:#F4FAFF;--ink-strong:#FFFFFF;--ink-soft:#CFDCF6;--ink-faint:#91A3CC;--border:#405487;--border-strong:#586FA8;--accent:#8993FF;--accent-ink:#D5DEFF;--accent-tint:rgba(137,147,255,.22);--on-accent:#101634;--audio:#ACCBFF;--audio-tint:rgba(172,203,255,.20);}',
            'html[data-theme="light"][data-easter-palette="stonakah"]{--bg:#F4EFEA;--surface:#FBF8F5;--rail:#E8DED4;--ink:#171316;--ink-strong:#050506;--ink-soft:#625451;--ink-faint:#8B7771;--border:#D7C5B9;--border-strong:#B9A08F;--accent:#7A2138;--accent-ink:#5B162A;--accent-tint:#EAD6DC;--on-accent:#FFFFFF;--audio:#223654;--audio-tint:#DCE3EC;--mute:#7A503D;--mute-tint:#E8DAD2;}':
            'html[data-theme="light"][data-easter-palette="stonakah"]{--bg:#A87861;--surface:#F4ECE7;--rail:#DDCEC4;--ink:#171316;--ink-strong:#050506;--ink-soft:#574642;--ink-faint:#79625C;--border:#C8AEA0;--border-strong:#AF8B79;--accent:#6E1F34;--accent-ink:#501426;--accent-tint:#E7D0D7;--on-accent:#FFFFFF;--audio:#18243B;--audio-tint:#D5DBE4;--mute:#6B4A3A;--mute-tint:#E2D2C9;}',
            'html[data-theme="dark"][data-easter-palette="stonakah"]{--bg:#0D0D10;--surface:#17151A;--rail:#11131A;--ink:#F4EEE9;--ink-strong:#FFFFFF;--ink-soft:#BDAFA9;--ink-faint:#776B67;--border:#30272A;--border-strong:#49373A;--accent:#8D2947;--accent-ink:#F0A6B9;--accent-tint:rgba(141,41,71,.22);--on-accent:#FFFFFF;--audio:#2E466E;--audio-tint:rgba(46,70,110,.28);--mute:#8A604A;--mute-tint:rgba(138,96,74,.22);}':
            'html[data-theme="dark"][data-easter-palette="stonakah"]{--bg:#111114;--surface:#1C171A;--rail:#18243B;--ink:#F4EEE9;--ink-strong:#FFFFFF;--ink-soft:#C6B7B0;--ink-faint:#877771;--border:#3A2B31;--border-strong:#563942;--accent:#8D2947;--accent-ink:#F0A6B9;--accent-tint:rgba(141,41,71,.24);--on-accent:#FFFFFF;--audio:#35527F;--audio-tint:rgba(53,82,127,.30);--mute:#8A604A;--mute-tint:rgba(138,96,74,.24);}',
            '.fetcher-easter-wash{position:fixed;inset:0;z-index:10000;pointer-events:none;opacity:1;clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));transition:clip-path 560ms cubic-bezier(.16,.84,.44,1),opacity 180ms var(--ease);will-change:clip-path,opacity;}':
            '.fetcher-easter-wash{position:fixed;inset:0;z-index:10000;pointer-events:none;opacity:1;clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));transition:opacity 420ms var(--ease);will-change:clip-path,opacity;}',
            '.fetcher-easter-wash.in{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}':
            '.fetcher-easter-wash.in{animation:fetcher-easter-wave-full 1320ms cubic-bezier(.16,.84,.44,1) both;}\n@keyframes fetcher-easter-wave-full{0%{clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));}56%{clip-path:circle(76vmax at var(--easter-x,50%) var(--easter-y,50%));}68%{clip-path:circle(70vmax at var(--easter-x,50%) var(--easter-y,50%));}84%{clip-path:circle(108vmax at var(--easter-x,50%) var(--easter-y,50%));}100%{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}}',
            'html[data-motion="reserved"] .fetcher-easter-wash{transition:clip-path 360ms var(--ease),opacity 150ms var(--ease);}':
            'html[data-motion="reserved"] .fetcher-easter-wash{transition:opacity 260ms var(--ease);}\nhtml[data-motion="reserved"] .fetcher-easter-wash.in{animation:fetcher-easter-wave-reserved 850ms var(--ease) both;}\n@keyframes fetcher-easter-wave-reserved{from{clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));}to{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}}',
            'html[data-motion="reduced"] .fetcher-easter-wash{clip-path:none!important;opacity:0;transition:opacity 120ms linear;}':
            'html[data-motion="reduced"] .fetcher-easter-wash{clip-path:none!important;opacity:0;transition:opacity 160ms linear;animation:none!important;}',
            "if (motion === 'reduced') return { wash: 120, settle: 100 };\n    if (motion === 'reserved') return { wash: 360, settle: 150 };\n    return { wash: 560, settle: 180 };":
            "if (motion === 'reduced') return { wash: 160, settle: 120 };\n    if (motion === 'reserved') return { wash: 850, settle: 260 };\n    return { wash: 1320, settle: 420 };"
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('missing expected block: ' + old[:90])
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit refinement and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fetcher-nav.js
          git rm .github/workflows/refine-easter-palettes.yml
          git commit -m "Slow Easter palette washes and deepen theme backgrounds"
          git push origin HEAD:fix/paw-cursor-readability
