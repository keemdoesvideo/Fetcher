name: Fix Easter JS syntax

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

# Triggered after the palette refinement to validate the generated controller.
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
      - name: Repair generated CSS string entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fetcher-nav.js')
          s = p.read_text()
          old1 = "    '.fetcher-easter-wash.in{animation:fetcher-easter-wave-full 1320ms cubic-bezier(.16,.84,.44,1) both;}\n@keyframes fetcher-easter-wave-full{0%{clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));}56%{clip-path:circle(76vmax at var(--easter-x,50%) var(--easter-y,50%));}68%{clip-path:circle(70vmax at var(--easter-x,50%) var(--easter-y,50%));}84%{clip-path:circle(108vmax at var(--easter-x,50%) var(--easter-y,50%));}100%{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}}',"
          new1 = "    '.fetcher-easter-wash.in{animation:fetcher-easter-wave-full 1320ms cubic-bezier(.16,.84,.44,1) both;}',\n    '@keyframes fetcher-easter-wave-full{0%{clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));}56%{clip-path:circle(76vmax at var(--easter-x,50%) var(--easter-y,50%));}68%{clip-path:circle(70vmax at var(--easter-x,50%) var(--easter-y,50%));}84%{clip-path:circle(108vmax at var(--easter-x,50%) var(--easter-y,50%));}100%{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}}',"
          old2 = "    'html[data-motion=\"reserved\"] .fetcher-easter-wash{transition:opacity 260ms var(--ease);}\nhtml[data-motion=\"reserved\"] .fetcher-easter-wash.in{animation:fetcher-easter-wave-reserved 850ms var(--ease) both;}\n@keyframes fetcher-easter-wave-reserved{from{clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));}to{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}}',"
          new2 = "    'html[data-motion=\"reserved\"] .fetcher-easter-wash{transition:opacity 260ms var(--ease);}',\n    'html[data-motion=\"reserved\"] .fetcher-easter-wash.in{animation:fetcher-easter-wave-reserved 850ms var(--ease) both;}',\n    '@keyframes fetcher-easter-wave-reserved{from{clip-path:circle(0 at var(--easter-x,50%) var(--easter-y,50%));}to{clip-path:circle(150vmax at var(--easter-x,50%) var(--easter-y,50%));}}',"
          if old1 not in s or old2 not in s:
              raise SystemExit('expected malformed entries not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          node --check fetcher-nav.js
      - name: Commit syntax fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fetcher-nav.js
          git rm .github/workflows/fix-easter-js.yml
          git commit -m "Fix Easter palette keyframe string syntax"
          git push origin HEAD:fix/paw-cursor-readability
