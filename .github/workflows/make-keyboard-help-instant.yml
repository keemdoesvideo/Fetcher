name: Make shortcuts help immediate

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Remove animation from shortcuts utility
        shell: python
        run: |
          from pathlib import Path
          path = Path('fetcher-main.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Shortcuts are a frequent utility: open and close immediately. */'
          block = '''
          /* Shortcuts are a frequent utility: open and close immediately. */
          .kbd-bubble,
          .kbd-bubble-list,
          .kbd-bubble-body{
            transition:none!important;
            animation:none!important;
          }
          '''
          if marker not in text:
              path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          node --check fetcher-main.js
          python - <<'PY'
          from pathlib import Path
          import re
          css = Path('fetcher-main.css').read_text(encoding='utf-8')
          assert 'Shortcuts are a frequent utility' in css
          assert '.kbd-bubble-list,' in css
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
          stripped = re.sub(r'"(?:\\.|[^"\\])*"', '""', stripped)
          stripped = re.sub(r"'(?:\\.|[^'\\])*'", "''", stripped)
          assert stripped.count('{') == stripped.count('}')
          PY

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/make-keyboard-help-instant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-main.css .github/workflows/make-keyboard-help-instant.yml
          git commit -m "Make shortcuts utility immediate"
          git push origin HEAD:fix/paw-cursor-readability
