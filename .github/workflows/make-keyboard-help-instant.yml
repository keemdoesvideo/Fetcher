name: Make keyboard help instant

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Separate keyboard and pointer invocation motion
        shell: python
        run: |
          from pathlib import Path

          js = Path('fetcher-main.js')
          text = js.read_text(encoding='utf-8')

          old = """  function setHelp(open) {
            kbdBubble.classList.toggle('open', open);
            kbdToggle.setAttribute('aria-expanded', String(open));
          }
          function helpOpen() { return kbdBubble.classList.contains('open'); }
          function toggleHelp(show) { setHelp(show === undefined ? !helpOpen() : show); }
          """
          new = """  function setHelp(open, instant) {
            if (instant) kbdBubble.classList.add('instant');
            kbdBubble.classList.toggle('open', open);
            kbdToggle.setAttribute('aria-expanded', String(open));
            if (instant) {
              requestAnimationFrame(function () {
                requestAnimationFrame(function () { kbdBubble.classList.remove('instant'); });
              });
            }
          }
          function helpOpen() { return kbdBubble.classList.contains('open'); }
          function toggleHelp(show, instant) { setHelp(show === undefined ? !helpOpen() : show, instant); }
          """
          if old not in text:
              raise SystemExit('help function block not found')
          text = text.replace(old, new, 1)

          old_key = """    if (event.key === '?' && !typing) {
            event.preventDefault();
            toggleHelp();
            return;
          }
          """
          new_key = """    if (event.key === '?' && !typing) {
            event.preventDefault();
            toggleHelp(undefined, true);
            return;
          }
          """
          if old_key not in text:
              raise SystemExit('question-mark shortcut block not found')
          text = text.replace(old_key, new_key, 1)

          old_escape = "      if (helpOpen()) { setHelp(false); return; }"
          if old_escape not in text:
              raise SystemExit('Escape help-close line not found')
          text = text.replace(old_escape, "      if (helpOpen()) { setHelp(false, true); return; }", 1)
          js.write_text(text, encoding='utf-8')

          css = Path('fetcher-main.css')
          style = css.read_text(encoding='utf-8')
          marker = '/* Keyboard invocation deliberately bypasses panel motion. */'
          if marker not in style:
              style = style.rstrip() + '''

          /* Keyboard invocation deliberately bypasses panel motion. Pointer clicks
             still use the selected Full/Reserved motion language. */
          .kbd-bubble.instant,
          .kbd-bubble.instant .kbd-bubble-list,
          .kbd-bubble.instant .kbd-bubble-body{
            transition:none!important;
            animation:none!important;
          }
          '''
              css.write_text(style, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          node --check fetcher-main.js
          python - <<'PY'
          from pathlib import Path
          import re
          js = Path('fetcher-main.js').read_text(encoding='utf-8')
          css = Path('fetcher-main.css').read_text(encoding='utf-8')
          assert 'toggleHelp(undefined, true)' in js
          assert 'setHelp(false, true)' in js
          assert "classList.add('instant')" in js
          assert '.kbd-bubble.instant' in css
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
          stripped = re.sub(r'"(?:\\.|[^"\\])*"', '""', stripped)
          stripped = re.sub(r"'(?:\\.|[^'\\])*'", "''", stripped)
          assert stripped.count('{') == stripped.count('}')
          PY

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/make-keyboard-help-instant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-main.js fetcher-main.css .github/workflows/make-keyboard-help-instant.yml
          git commit -m "Make keyboard shortcut help immediate"
          git push origin HEAD:fix/paw-cursor-readability
