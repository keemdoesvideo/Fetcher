name: Extract remaining static pages

on:
  push:
    branches:
      - fix/paw-cursor-readability
    paths:
      - .github/workflows/extract-static-pages.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Move page-owned styles and About controller out of HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          css_map = {
              'about.html': 'fetcher-about.css',
              'donate.html': 'fetcher-donate.css',
              'updates.html': 'fetcher-updates.css',
          }

          for page_name, css_name in css_map.items():
              path = Path(page_name)
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(r'\n<style>.*?</style>', '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{page_name}: expected one inline style block')
              shell = '<link rel="stylesheet" href="fetcher-shell.css">'
              link = f'<link rel="stylesheet" href="{css_name}">'
              if link not in text:
                  if shell not in text:
                      raise SystemExit(f'{page_name}: shell stylesheet marker missing')
                  text = text.replace(shell, shell + '\n' + link, 1)
              path.write_text(text, encoding='utf-8')

          about = Path('about.html')
          text = about.read_text(encoding='utf-8')
          text, count = re.subn(r'\n<script>\s*\(function\(\)\{.*?</script>', '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('about.html: expected one inline controller script')
          text = text.replace('</body>', '<script src="fetcher-about.js"></script>\n</body>', 1)
          about.write_text(text, encoding='utf-8')

          app = Path('server/app.py')
          text = app.read_text(encoding='utf-8')
          css_marker = '    "fetcher-soon.css": "text/css; charset=utf-8",\n'
          css_entries = (
              '    "fetcher-about.css": "text/css; charset=utf-8",\n'
              '    "fetcher-donate.css": "text/css; charset=utf-8",\n'
              '    "fetcher-updates.css": "text/css; charset=utf-8",\n'
          )
          if '"fetcher-about.css"' not in text:
              if css_marker not in text:
                  raise SystemExit('server/app.py: CSS allowlist marker missing')
              text = text.replace(css_marker, css_marker + css_entries, 1)

          js_marker = '    "fetcher-settings.js": "application/javascript; charset=utf-8",\n'
          js_entry = '    "fetcher-about.js": "application/javascript; charset=utf-8",\n'
          if '"fetcher-about.js"' not in text:
              if js_marker not in text:
                  raise SystemExit('server/app.py: JS allowlist marker missing')
              text = text.replace(js_marker, js_marker + js_entry, 1)
          app.write_text(text, encoding='utf-8')

          # Theme is no longer the rail owner; keep the file header accurate.
          theme = Path('fetcher-theme.css')
          text = theme.read_text(encoding='utf-8')
          text = text.replace(
              ' * Shared across every Fetcher page: fonts, color tokens (light + dark),\n * base resets, and the persistent sidebar. Keeping this in one file means\n',
              ' * Shared across every Fetcher page: fonts, color tokens (light + dark) and\n * base/reset/application styling. Keeping this in one file means\n',
              1
          )
          theme.write_text(text, encoding='utf-8')

      - name: Validate all page ownership
        shell: bash
        run: |
          for file in fetcher-prefs.js fetcher-nav.js fetcher-main.js fetcher-settings.js fetcher-about.js fetcher-trimmer.js; do
            node --check "$file"
          done
          python -m compileall -q server run.py
          python - <<'PY'
          from pathlib import Path
          import re

          pages = ['project-fetcher.html','settings.html','image.html','chat.html','donate.html','updates.html','about.html']
          for name in pages:
              text = Path(name).read_text(encoding='utf-8')
              assert '<style>' not in text, f'{name}: inline style remains'
              assert text.count('href="fetcher-theme.css"') == 1
              assert text.count('href="fetcher-shell.css"') == 1

          assert 'fetcher-main.css' in Path('project-fetcher.html').read_text(encoding='utf-8')
          assert 'fetcher-settings.css' in Path('settings.html').read_text(encoding='utf-8')
          assert 'fetcher-soon.css' in Path('image.html').read_text(encoding='utf-8')
          assert 'fetcher-soon.css' in Path('chat.html').read_text(encoding='utf-8')
          assert 'fetcher-donate.css' in Path('donate.html').read_text(encoding='utf-8')
          assert 'fetcher-updates.css' in Path('updates.html').read_text(encoding='utf-8')
          about = Path('about.html').read_text(encoding='utf-8')
          assert 'fetcher-about.css' in about and 'fetcher-about.js' in about
          assert '<script>\n(function(){' not in about

          allowlist = Path('server/app.py').read_text(encoding='utf-8')
          for asset in ['fetcher-soon.css','fetcher-about.css','fetcher-donate.css','fetcher-updates.css','fetcher-about.js']:
              assert f'"{asset}"' in allowlist, asset

          for css_name in ['fetcher-theme.css','fetcher-shell.css','fetcher-main.css','fetcher-settings.css','fetcher-soon.css','fetcher-about.css','fetcher-donate.css','fetcher-updates.css','fetcher-trimmer.css']:
              text = Path(css_name).read_text(encoding='utf-8')
              stripped = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              stripped = re.sub(r'"(?:\\.|[^"\\])*"', '""', stripped)
              stripped = re.sub(r"'(?:\\.|[^'\\])*'", "''", stripped)
              assert stripped.count('{') == stripped.count('}'), css_name
          PY

      - name: Commit extraction and remove workflow
        run: |
          rm .github/workflows/extract-static-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html donate.html updates.html server/app.py fetcher-theme.css .github/workflows/extract-static-pages.yml
          git commit -m "Finish page-specific ownership cleanup"
          git push origin HEAD:fix/paw-cursor-readability
