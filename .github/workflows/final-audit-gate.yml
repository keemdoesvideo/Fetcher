name: Retire temporary final audit gate

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/final-audit-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/final-audit-gate.yml
          git commit -m "Retire temporary final audit gate"
          git push origin HEAD:fix/paw-cursor-readability
