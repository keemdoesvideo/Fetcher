name: Tune utility glass shadows

on:
  push:
    branches:
      - fix/paw-cursor-readability
    paths:
      - .github/workflows/tune-utility-shadows.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Soften download and shortcuts shadows
        shell: python
        run: |
          from pathlib import Path
          path = Path('fetcher-main.css')
          text = path.read_text(encoding='utf-8')
          old_closed = 'box-shadow:0 6px 22px -10px rgba(0,0,0,.32);'
          new_closed = 'box-shadow:0 1px 4px rgba(0,0,0,.08);'
          old_open = 'box-shadow:0 18px 48px -14px rgba(0,0,0,.5);'
          new_open = 'box-shadow:0 12px 32px -24px rgba(0,0,0,.28);'
          assert text.count(old_closed) == 2, text.count(old_closed)
          assert text.count(old_open) == 2, text.count(old_open)
          text = text.replace(old_closed, new_closed)
          text = text.replace(old_open, new_open)
          path.write_text(text, encoding='utf-8')

      - name: Commit product change and retire workflow
        run: |
          rm .github/workflows/tune-utility-shadows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-main.css .github/workflows/tune-utility-shadows.yml
          git commit -m "Soften floating utility shadows"
          git push origin HEAD:fix/paw-cursor-readability
