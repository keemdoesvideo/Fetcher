name: Cleanup legacy Fetcher theme

on:
  push:
    branches:
      - fix/paw-cursor-readability
    paths:
      - .github/workflows/cleanup-legacy-theme.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Remove obsolete cursor and View Transition source
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('fetcher-theme.css')
          text = path.read_text(encoding='utf-8')

          # The approved cursor now lives in fetcher-shell.css + two SVG assets.
          cursor_start = text.find('/* ---------- Cursor:')
          cursor_end = text.find('.spin-ring{', cursor_start)
          if cursor_start != -1 and cursor_end != -1:
              text = text[:cursor_start] + text[cursor_end:]

          # Cross-document View Transitions were replaced by the persistent shell.
          vt_start = text.find('/* Page transitions are handled by the cross-document')
          vt_end = text.find('/* ---------- Sidebar', vt_start)
          if vt_start != -1 and vt_end != -1:
              text = text[:vt_start] + text[vt_end:]

          # Named-transition remnants on the rail/pill are no longer meaningful.
          text = re.sub(r'\n\s*view-transition-name:rail;[^\n]*', '', text)
          text = re.sub(r'\n\s*view-transition-name:nav-pill;[^\n]*', '', text)

          # Update the stale pill comment without altering its visual styling.
          text = re.sub(
              r'/\* Current-page highlight is a pill BEHIND the button content, so it can slide.*?\*/',
              '/* Current-page highlight pill. Cross-page animation is owned by fetcher-shell.css. */',
              text,
              flags=re.S,
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/cleanup-legacy-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-theme.css .github/workflows/cleanup-legacy-theme.yml
          git commit -m "Remove legacy cursor and View Transition code"
          git push origin HEAD:fix/paw-cursor-readability
