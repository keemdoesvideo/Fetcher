name: Repair reduced motion semantics

on:
  push:
    branches:
      - fix/paw-cursor-readability

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paw-cursor-readability
          fetch-depth: 0

      - name: Replace universal motion kill-switch with component-owned Reduced behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          theme = Path('fetcher-theme.css')
          text = theme.read_text(encoding='utf-8')
          pattern = re.compile(
              r'/\* Explicit override wins over.*?\*/\n'
              r'\[data-motion="reduced"\] \*,\n'
              r'\[data-motion="reduced"\] \*::before,\n'
              r'\[data-motion="reduced"\] \*::after\{.*?\}\n',
              re.S,
          )
          replacement = '''/* Reduced motion is component-owned. Pages remove spatial/overshoot motion\n   while retaining short opacity, colour and state feedback where useful. */\nhtml[data-motion="reduced"]{scroll-behavior:auto;}\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('fetcher-theme.css: legacy reduced-motion kill-switch not found')
          theme.write_text(text, encoding='utf-8')

          blocks = {
              'fetcher-shell.css': r'''
/* Reduced: structural rail changes snap; labels/page content use opacity only. */
html[data-motion="reduced"]{--shell-rail-collapse-dur:0ms;}
html[data-motion="reduced"] .rail-toggle,
html[data-motion="reduced"] .rail-btn{
  transform:none!important;
  transition:background 100ms linear,color 100ms linear,border-color 100ms linear!important;
}
html[data-motion="reduced"] .rail-toggle svg,
html[data-motion="reduced"] .rail-btn svg{transition:none!important;transform:none!important;}
html[data-motion="reduced"] .rail-btn span{
  transform:none!important;
  transition:opacity 100ms linear!important;
}
''',
              'fetcher-main.css': r'''
/* Reduced: keep useful fades/state feedback, remove spatial travel and spring. */
html[data-motion="reduced"] .services-panel,
html[data-motion="reduced"] .fetch-wrap,
html[data-motion="reduced"] .dl-bubble-list,
html[data-motion="reduced"] .kbd-bubble-list{transition:none!important;}
html[data-motion="reduced"] .services-toggle svg.chev,
html[data-motion="reduced"] .segmented .thumb,
html[data-motion="reduced"] .seg-btn svg,
html[data-motion="reduced"] .fetch-btn,
html[data-motion="reduced"] .paste-btn,
html[data-motion="reduced"] .dl-bubble-toggle,
html[data-motion="reduced"] .kbd-bubble-toggle,
html[data-motion="reduced"] .recent-refetch,
html[data-motion="reduced"] .recent-remove,
html[data-motion="reduced"] .welcome-btn{transform:none!important;}
html[data-motion="reduced"] .chips,
html[data-motion="reduced"] .fetch-wrap-inner,
html[data-motion="reduced"] .dl-bubble-body,
html[data-motion="reduced"] .kbd-bubble-body,
html[data-motion="reduced"] .welcome-card{
  transform:none!important;
  transition:opacity 100ms linear!important;
}
html[data-motion="reduced"] .dl-bubble,
html[data-motion="reduced"] .kbd-bubble{
  transition:box-shadow 100ms linear!important;
}
html[data-motion="reduced"] .fetch-status,
html[data-motion="reduced"] .fetch-progress{
  transition:opacity 100ms linear!important;
}
html[data-motion="reduced"] .fetch-progress-bar{transition:transform 100ms linear!important;}
html[data-motion="reduced"] .welcome-scrim{transition:opacity 120ms linear!important;}
html[data-motion="reduced"] .celebrate-msg{
  transform:translate(-50%,-50%) scale(1)!important;
  transition:opacity 100ms linear!important;
}
''',
              'fetcher-settings.css': r'''
/* Reduced: settings state changes are immediate except for short opacity feedback. */
html[data-motion="reduced"] .settings-nav-thumb,
html[data-motion="reduced"] .settings-seg .thumb{transition:none!important;}
html[data-motion="reduced"] .saved-flash{transition:opacity 120ms linear!important;}
''',
              'fetcher-trimmer.css': r'''
/* Reduced: mount geometry snaps; the panel itself simply fades into place. */
html[data-motion="reduced"] .trim-mount{transition:none!important;}
html[data-motion="reduced"] .trim-panel{
  transform:none!important;
  transition:opacity 100ms linear,border-color 100ms linear,background 100ms linear!important;
}
''',
          }

          for name, block in blocks.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              marker = block.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

      - name: Validate Reduced motion semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          theme = Path('fetcher-theme.css').read_text(encoding='utf-8')
          assert 'transition-duration:0.001ms' not in theme
          assert 'animation-duration:0.001ms' not in theme
          assert 'component-owned' in theme

          shell = Path('fetcher-shell.css').read_text(encoding='utf-8')
          main = Path('fetcher-main.css').read_text(encoding='utf-8')
          settings = Path('fetcher-settings.css').read_text(encoding='utf-8')
          trimmer = Path('fetcher-trimmer.css').read_text(encoding='utf-8')
          assert '--shell-rail-collapse-dur:0ms' in shell
          assert 'transition:opacity 100ms linear!important' in main
          assert '.settings-nav-thumb' in settings and 'transition:none!important' in settings
          assert '.trim-mount{transition:none!important;}' in trimmer

          for name in ['fetcher-theme.css','fetcher-shell.css','fetcher-main.css','fetcher-settings.css','fetcher-trimmer.css']:
              text = Path(name).read_text(encoding='utf-8')
              stripped = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              stripped = re.sub(r'"(?:\\.|[^"\\])*"', '""', stripped)
              stripped = re.sub(r"'(?:\\.|[^'\\])*'", "''", stripped)
              assert stripped.count('{') == stripped.count('}'), name
          PY

      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/repair-reduced-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetcher-theme.css fetcher-shell.css fetcher-main.css fetcher-settings.css fetcher-trimmer.css .github/workflows/repair-reduced-motion.yml
          git commit -m "Make reduced motion gentler instead of zero"
          git push origin HEAD:fix/paw-cursor-readability
